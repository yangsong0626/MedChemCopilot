[project]
name = "medchemcopilot-backend"
version = "0.1.0"
description = "Backend API and services for MedChemCopilot."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.4",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../tests", "tests"]

